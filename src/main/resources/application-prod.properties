spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cloudinary Configuration (Production)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Telegram Configuration (Production)
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.channel.chat.id=${TELEGRAM_CHANNEL_CHAT_ID}
telegram.notifications.enabled=true

# Azure Configuration НЕ Е ТЕСТВАНО !!!
server.forward-headers-strategy=framework
# НЕ Е ТЕСТВАНО !!!
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.base-url=https://dragon-dojo.azurewebsites.net
